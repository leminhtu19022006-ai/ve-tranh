<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư Viện Tranh Nghệ Thuật</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f13;
    color: #f0f0f0;
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 40px 20px;
    text-align: center;
    border-bottom: 2px solid #e94560;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  header h1 {
    font-size: 2.2rem;
    background: linear-gradient(90deg, #e94560, #f5a623, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  header p { color: #aaa; margin-top: 6px; font-size: 0.95rem; }

  .categories {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 25px 20px;
    background: #15151c;
    border-bottom: 1px solid #2a2a3a;
  }
  .cat-btn {
    padding: 10px 24px;
    border: 2px solid #e94560;
    background: transparent;
    color: #e94560;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.3s ease;
  }
  .cat-btn:hover, .cat-btn.active {
    background: #e94560;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(233,69,96,0.4);
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
    padding: 40px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #1a1a24;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    border: 1px solid #2a2a3a;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(233,69,96,0.3);
    border-color: #e94560;
  }
  .card-img-wrap {
    width: 100%;
    height: 240px;
    overflow: hidden;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .card:hover img { transform: scale(1.08); }
  .card-info { padding: 18px; }
  .card-info h3 { font-size: 1.15rem; margin-bottom: 6px; color: #fff; }
  .card-info .artist { color: #e94560; font-size: 0.88rem; font-weight: 600; }
  .card-info .year { color: #888; font-size: 0.82rem; margin-top: 4px; }

  /* ảnh lỗi fallback */
  .img-fallback {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #555;
    font-size: 3rem;
    background: linear-gradient(135deg, #1a1a24, #0f0f13);
  }
  .img-fallback small {
    font-size: 0.8rem;
    color: #666;
    margin-top: 8px;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #1a1a24;
    border-radius: 16px;
    max-width: 950px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    position: relative;
    border: 2px solid #e94560;
    animation: zoomIn 0.3s ease;
  }
  @keyframes zoomIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-img-wrap {
    width: 100%;
    max-height: 55vh;
    min-height: 300px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-img-wrap img {
    max-width: 100%;
    max-height: 55vh;
    object-fit: contain;
    display: block;
  }
  .modal-body { padding: 28px 32px; }
  .modal-body h2 { font-size: 1.8rem; color: #f5a623; margin-bottom: 8px; }
  .modal-body .artist-line {
    color: #e94560;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 18px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .detail-item {
    background: #12121a;
    padding: 12px 16px;
    border-radius: 10px;
    border-left: 3px solid #e94560;
  }
  .detail-item .label { font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail-item .value { font-size: 1rem; color: #fff; font-weight: 600; margin-top: 2px; }
  .desc { color: #ccc; font-size: 0.97rem; line-height: 1.8; }

  .close-btn {
    position: absolute;
    top: 14px;
    right: 18px;
    background: #e94560;
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.2s;
  }
  .close-btn:hover { transform: rotate(90deg) scale(1.1); }

  footer {
    text-align: center;
    padding: 30px;
    color: #666;
    font-size: 0.85rem;
    border-top: 1px solid #2a2a3a;
    margin-top: 20px;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.5rem; }
    .gallery { padding: 20px; gap: 18px; }
    .modal-body { padding: 20px; }
    .modal-body h2 { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🎨 Thư Viện Tranh Nghệ Thuật</h1>
  <p>Khám phá những kiệt tác hội họa nổi tiếng thế giới</p>
</header>

<div class="categories" id="categories">
  <button class="cat-btn active" data-cat="all">Tất cả</button>
  <button class="cat-btn" data-cat="Phục Hưng">Phục Hưng</button>
  <button class="cat-btn" data-cat="Ấn Tượng">Ấn Tượng</button>
  <button class="cat-btn" data-cat="Hậu Ấn Tượng">Hậu Ấn Tượng</button>
  <button class="cat-btn" data-cat="Lập Thể">Lập Thể</button>
  <button class="cat-btn" data-cat="Siêu Thực">Siêu Thực</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="modal-img-wrap" id="modalImgWrap">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="artist-line" id="modalArtist"></div>
      <div class="detail-grid" id="modalDetails"></div>
      <p class="desc" id="modalDesc"></p>
    </div>
  </div>
</div>

<footer>
  © 2025 Thư Viện Tranh Nghệ Thuật · Bấm vào từng bức tranh để xem chi tiết
</footer>

<script>

  },

    category: "Phục Hưng",
    medium: "Sơn dầu trên vải",
    size: "44,5 × 39 cm",
    location: "Mauritshuis, The Hague",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/480px-1665_Girl_with_a_Pearl_Earring.jpg",

  },
  {
    id: 9,
    title: "Bữa Tiệc Ly",
    artist: "Leonardo da Vinci",
    year: "1495 – 1498",
    category: "Phục Hưng",
    medium: "Tempera trên thạch cao",
    size: "460 × 880 cm",
    location: "Nhà thờ Santa Maria delle Grazie, Milan",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/%C3%9Altima_Cena_-_Da_Vinci_5.jpg/640px-%C3%9Altima_Cena_-_Da_Vinci_5.jpg",
    desc: "Bức bích họa vĩ đại mô tả khoảnh khắc Chúa Jesus tuyên bố một trong các môn đệ sẽ phản bội Ngài. Da Vinci đã dành 3 năm để hoàn thành tác phẩm với kỹ thuật phối cảnh và biểu cảm nhân vật đỉnh cao."
  },
  {
    id: 10,
    title: "Ấn Tượng Mặt Trời Mọc",
    artist: "Claude Monet",
    year: "1872",
    category: "Ấn Tượng",
    medium: "Sơn dầu trên vải",
    size: "48 × 63 cm",
    location: "Bảo tàng Marmottan Monet, Paris",
    img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Monet_-_Impression%2C_Sunrise.jpg/640px-Monet_-_Impression%2C_Sunrise.jpg",
    desc: "Tác phẩm đã đặt tên cho cả trường phái Ấn Tượng. Bức tranh khắc họa cảnh cảng Le Havre trong ánh bình minh mờ ảo, với những nét cọ nhanh và màu sắc tươi sáng."
  }
];

/* ===== RENDER GALLERY ===== */
const gallery = document.getElementById('gallery');
const catBtns = document.querySelectorAll('.cat-btn');

function renderGallery(cat) {
  const filtered = cat === 'all' ? paintings : paintings.filter(p => p.category === cat);
  gallery.innerHTML = filtered.map(p => `
    <div class="card" onclick="openModal(${p.id})">
      <div class="card-img-wrap">
        <img src="${p.img}" alt="${p.title}" loading="lazy"
             onerror="this.parentNode.innerHTML='<div class=&quot;img-fallback&quot;>🖼️<small>Không tải được ảnh</small></div>'">
      </div>
      <div class="card-info">
        <h3>${p.title}</h3>
        <div class="artist">${p.artist}</div>
        <div class="year">${p.year} · ${p.category}</div>
      </div>
    </div>
  `).join('');
}

catBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    catBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGallery(btn.dataset.cat);
  });
});

/* ===== MODAL ===== */
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalImgWrap = document.getElementById('modalImgWrap');
const modalTitle = document.getElementById('modalTitle');
const modalArtist = document.getElementById('modalArtist');
const modalDetails = document.getElementById('modalDetails');
const modalDesc = document.getElementById('modalDesc');

function openModal(id) {
  const p = paintings.find(x => x.id === id);
  if (!p) return;

  // reset wrap rồi thêm img mới để onerror hoạt động lại
  modalImgWrap.innerHTML = '';
  const newImg = document.createElement('img');
  newImg.src = p.img;
  newImg.alt = p.title;
  newImg.onerror = () => {
    modalImgWrap.innerHTML = '<div class="img-fallback">🖼️<small>Không tải được ảnh</small></div>';
  };
  modalImgWrap.appendChild(newImg);

  modalTitle.textContent = p.title;
  modalArtist.textContent = '👤 ' + p.artist;

  modalDetails.innerHTML = `
    <div class="detail-item"><div class="label">Năm sáng tác</div><div class="value">${p.year}</div></div>
    <div class="detail-item"><div class="label">Trường phái</div><div class="value">${p.category}</div></div>
    <div class="detail-item"><div class="label">Chất liệu</div><div class="value">${p.medium}</div></div>
    <div class="detail-item"><div class="label">Kích thước</div><div class="value">${p.size}</div></div>
    <div class="detail-item"><div class="label">Vị trí</div><div class="value">${p.location}</div></div>
  `;
  modalDesc.textContent = p.desc;
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

renderGallery('all');
</script>
</body>
</html>
